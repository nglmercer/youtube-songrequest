<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador con Resultados</title>
    <link rel="stylesheet" href="main.css">
    <script src="./components/socket.io.min.js"></script>
    <script src="./components/webcomponents.js"></script>
</head>
<body>

  <side-bar>
    <div slot="sidebar-content">
<!--         <login-button platform="tiktok"></login-button>
      <login-button platform="twitch"></login-button>
      <login-button platform="kick"></login-button> -->
      
    </div>
  </side-bar>
  
  <nav-bar>
    <div slot="navbar-content" class="flex justify-between w-full">
        <search-input theme="dark"></search-input>


        <custom-dropdown mode="dark">
          <button slot="trigger" class="btn btn-primary absolute top-0">a</button>
          <login-button platform="tiktok"></login-button>
          <login-button platform="twitch"></login-button>
          <login-button platform="kick"></login-button>
          <nested-menu theme="dark"></nested-menu>

        </custom-dropdown>
    </div>
  </nav-bar>

  <main-content>
    
    <div slot="1-content" style="        margin-left: calc(5% - 20px);">
        <div>          
          <ytmusic-guide-section-renderer></ytmusic-guide-section-renderer>
          <script>
            document.addEventListener('guide-section-click', (e) => {
              console.log(e.detail);
            });
          </script>
          <suggestion-carousel>
            <button class="item">item1</button>
            
          </suggestion-carousel>
          <div class="Sugerencias" id="Sugerencias"></div>
          <youtube-grid id="results-grid" dark-mode></youtube-grid>
          <div id="results-container" class="results-container">

      </div>

      </div>
    </div>  
    <div slot="2-content">
      <p>Here are your Projects.</p>

    </div>
    <div slot="3-content">
      <p>You have new Messages!</p>

    </div>
    <div slot="4-content">
      <p>Adjust your Settings here.</p>

    </div>
    <div slot="5-content" class="flex justify-center w-full">

    </div>
  </main-content>
  <mini-player> 
    <div slot="main">
      <sync-media-player id="mediaPlayer" autoplay="true"></sync-media-player>  
    </div>
    <div slot="details">
      <p>Detalles adicionales sobre el contenido.</p>
    </div>
  </mini-player>
</div>
        <script src="main.js" type="module"></script>
</body>
</html>
